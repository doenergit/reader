<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Reader</title>

  <!-- PWA & iOS Safari tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
  
  <!-- Local libraries for 100% offline usage -->
  <script src="lib/jszip.min.js"></script>
  <script src="lib/epub.min.js"></script>
</head>
<body>

  <!-- ================== LIBRARY VIEW ================== -->
  <div id="library-view">
    
    <!-- Pull to Refresh Banner -->
    <div id="ptr-indicator" class="ptr-indicator">
      <div class="ptr-spinner"></div>
      <span id="ptr-text">Nach unten ziehen zum Aktualisieren</span>
    </div>

    <header class="library-header">
      <h1>Meine Bücher</h1>
      <button id="add-book-btn" class="btn-add">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Hinzufügen
      </button>
      <input type="file" id="file-input" style="display: none;">
    </header>

    <main class="library-content">
      <div id="empty-state" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 12px;">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <p>Noch keine Bücher vorhanden.</p>
        <p>Tippe oben auf <strong>Hinzufügen</strong>, um eine <code>.cbz</code> oder <code>.epub</code> Datei von deinem iPhone auszuwählen.</p>
      </div>

      <div id="book-list" class="book-list"></div>
    </main>
  </div>

  <!-- ================== READER VIEW ================== -->
  <div id="reader-view">
    <div class="reader-canvas-container">
      <div id="loading" class="loading-indicator">Laden...</div>
      
      <!-- CBZ 3-Panel Seamless Gallery Carousel -->
      <div id="cbz-carousel" style="display: none; width: 100%; height: 100%; position: absolute; inset: 0; overflow: hidden; touch-action: none;">
        <div id="cbz-track" style="display: flex; width: 300%; height: 100%; transform: translateX(-33.333333%); will-change: transform;">
          
          <div id="panel-0" class="carousel-panel">
            <div class="panel-inner" id="panel-0-inner">
              <img id="p0-img1" class="comic-img">
              <img id="p0-img2" class="comic-img" style="display: none;">
            </div>
          </div>

          <div id="panel-1" class="carousel-panel">
            <div class="panel-inner" id="panel-1-inner">
              <img id="p1-img1" class="comic-img">
              <img id="p1-img2" class="comic-img" style="display: none;">
            </div>
          </div>

          <div id="panel-2" class="carousel-panel">
            <div class="panel-inner" id="panel-2-inner">
              <img id="p2-img1" class="comic-img">
              <img id="p2-img2" class="comic-img" style="display: none;">
            </div>
          </div>

        </div>
      </div>
      
      
      <!-- CBZ Vertical Webtoon Viewer -->
      <div id="cbz-vertical" style="display: none; width: 100%; height: 100%; position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;">
        <div id="cbz-vertical-container" style="display: flex; flex-direction: column; align-items: center; width: 100%; min-height: 100%;"></div>
      </div>

      <!-- EPUB HTML Viewer -->
      <div id="epub-viewer" style="display: none;"></div>
    </div>

    <!-- Controls Overlay -->
    <div id="reader-overlay" class="reader-overlay">
      <div class="reader-top-bar">
        <button id="close-reader-btn" class="btn-icon" title="Zurück zur Bibliothek">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div id="reader-title" class="reader-title">Titel</div>
        <button id="settings-btn" class="btn-icon" title="Einstellungen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <div class="reader-bottom-bar">
        <div class="progress-row">
          <input type="range" id="page-slider" class="page-slider" min="1" max="1" value="1">
          <span id="page-info" class="page-info">1 / 1</span>
        </div>
      </div>
    </div>
  </div>

  
  
  <!-- iOS Action Sheet Modal for Delete Confirmation -->
  <div id="delete-modal" class="action-sheet-overlay" style="display: none;">
    <div class="action-sheet-sheet">
      <div class="action-sheet-group">
        <div class="action-sheet-header">
          <div class="action-sheet-title" id="delete-modal-title">Buchname</div>
          <div class="action-sheet-subtitle">Möchtest du diese Datei von deinem iPhone entfernen?</div>
        </div>
        <button id="btn-confirm-delete" class="action-sheet-btn danger">🗑️ Datei löschen</button>
      </div>
      <div class="action-sheet-group" style="margin-top: 8px;">
        <button id="btn-cancel-delete" class="action-sheet-btn cancel">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="settings-modal" style="display: none;">
    <div class="settings-content">
      <div class="settings-header">
        <h3>Einstellungen</h3>
        <button id="close-settings-btn" class="btn-icon" style="background: none; color: white;">✕</button>
      </div>
      <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
        <button id="force-reload-btn" style="width: 100%; padding: 10px; background: var(--border-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">App aktualisieren (Neu laden)</button>
      </div>
      <div id="cbz-settings" style="display: none; padding: 16px;">
        <div class="setting-group">
          <label>Layout</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-opt="single" id="btn-layout-single">1 Seite</button>
            <button class="toggle-btn" data-opt="double" id="btn-layout-double">2 Seiten</button>
            <button class="toggle-btn" data-opt="vertical" id="btn-layout-vertical">Webtoon</button>
          </div>
        </div>
        <div class="setting-group" style="margin-top: 14px;">
          <label>Bildskalierung</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-opt="contain" id="btn-fit-contain">Ganzes Bild</button>
            <button class="toggle-btn" data-opt="width" id="btn-fit-width">Breite füllen</button>
          </div>
        </div>
        <div class="setting-group" id="group-direction" style="margin-top: 14px;">
          <label>Tippen & Wischen</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-opt="ltr" id="btn-dir-ltr">Rechts weiter 👉</button>
            <button class="toggle-btn" data-opt="rtl" id="btn-dir-rtl">Links weiter (Manga) 👈</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
